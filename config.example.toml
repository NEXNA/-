# QQ 设定整理机器人 · 行为配置
# 密钥统一放在同目录的 .env 里，不要写进这个文件。

[bot]
# 只监听本机，NapCat 和 bot 在同一台电脑上
host = "127.0.0.1"
port = 8080

# 数据目录，相对本文件所在目录
data_dir = "data"

# 单条素材最大字符数
max_input_chars = 2000

# 整理时附带多少条最近聊天作为“指代消解”上下文（不是素材）
context_messages = 8

# 同一个人的指令冷却（秒）
rate_limit_seconds = 3

# 一次整理最多处理多少条素材，防止一次调用过大
max_batch = 40

# 全量整理一次最多跑几批（防止一条指令跑太久）
max_full_batches = 10

# true = 只有管理员能触发「整理」
organize_admins_only = false

# 时区，用于时间戳和“今天”的 token 统计
timezone = "Asia/Shanghai"

[onebot]
# NapCat 的 HTTP API 地址（不是 WebSocket）
api_base = "http://127.0.0.1:3000"

[napcat]
# NapCat WebUI：控制台里的“QQ 扫码登录”用
webui_url = "http://127.0.0.1:6099"
# 与 NapCat 的 webui.json 里的 token 保持一致
webui_token = "replace-with-napcat-webui-token"

[deepseek]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
max_tokens = 16000
timeout_seconds = 180

# 设定库超过这个字符数就不再整份发给模型（先做腾挪/清理）
max_canon_chars = 300000

# 每天 token 上限（输入+输出），超过后拒绝整理
daily_token_budget = 2000000

[chat]
# 是否允许群里和摩卡闲聊（管理员可用「聊天 开/关」随时改）
enabled = true

# 同一个群两次聊天回复之间至少间隔多少秒（0 = 不限制）
cooldown_seconds = 20

# 聊天/评价每天单独的 token 上限，避免闲聊吃掉整理预算
daily_token_budget = 300000

# 单次聊天最多输出多少 token
max_tokens = 600

# 聊天时带多少条最近对话（user+assistant 合计）
history = 8

# 聊天/评价时发给模型的设定库摘要最大字符数
max_canon_chars = 10000

# 管理员是否绕过冷却（方便调试；设为 false 则管理员也受冷却限制）
admin_bypass_cooldown = true

# 多行回复时，每条之间的间隔（秒）
line_delay_seconds = 0.45

# 深度思考默认开关（管理员可用「思考 开/关」随时改）
thinking_default = false

# 思考强度：low / high / max
reasoning_effort = "high"

# 开思考时给思考过程 + 正文预留的 token
thinking_max_tokens = 1200

# 联网默认开关（管理员可用「联网 开/关」随时改）
web_search_default = false

# 一次联网搜索取几条结果
web_search_count = 5

[auto_speak]
# 是否允许摩卡自己接群里的普通消息（不需要 @）
enabled = true

# 两次自动发言之间至少间隔多少秒
cooldown_seconds = 180

# 每条普通消息触发自动发言的基础概率（百分比，4 = 4%）
probability_percent = 4

# 命中关键词时使用的概率（百分比）
interest_boost_percent = 35

# 至少积累多少条群消息才考虑自动发言
min_messages = 6

# 自动发言一次最多发几条（1-3）
max_lines = 2

# 图片消息是否用视觉模型判断“和摩卡/面包/吉他有关”（需要 deepseek-flash）
vision = true

# 兴趣关键词：命中后按 interest_boost_percent 触发
keywords = ["摩卡", "モカ", "moca", "面包", "吉他", "兰", "afterglow", "山吹", "莉莎"]

[sticker]
# 是否允许聊天/自动发言时附带 meme 表情包
enabled = true

# 没有明确指定表情时，按这个概率从语气匹配的表情包里随机选一张
auto_chance_percent = 25

# 一次从 QQ 收藏同步多少张（NapCat 接口上限内）
max_sync = 48

# 发送方式：base64（兼容性最好）或 path（部分 NapCat 需要开 enableLocalFile2Url）
send_mode = "base64"

[access]
# 允许使用的群号，必须显式填写，不填就不会工作
allow_groups = [123456789]

# 管理员 QQ：可以「裁决」「全量整理」「回滚」
admins = [10001]

[safety]
# 只有管理员能在这些群改设定/整合/删除；留空 = 所有允许群都允许管理员写。
# 新群只聊天、不写设定时，把群号只加到 allow_groups，不放到 write_groups。
write_groups = [123456789]

[fun]
# 新用户/新群的初始摩卡币
starting_coins = 80
# 打工冷却和随机收益
work_cooldown_seconds = 600
work_min_coins = 15
work_max_coins = 40
# 三项数值每小时自然下降多少，可按需要调
hunger_decay_per_hour = 6.0
sleepiness_decay_per_hour = 4.0
mood_decay_per_hour = 3.0

[bili]
# B站找图/本地图库
enabled = true
# 本地最多保存多少张
image_limit = 2000
# 一次「找图」默认下载多少张
fetch_default = 10
# 聊天时随机附带一张图库图片的概率（0 = 只靠 [[bili]] 标签）
chat_chance_percent = 8
# B站评论里 @ 的名字（当前是主人的B站昵称）
comment_mention = "your-bilibili-name"
comment_max_chars = 100
comment_cooldown_seconds = 300
# 评论功能已开；没有有效B站凭证时会自动报未登录，不会空跑
comment_enabled = false

[voice]
# Qwen TTS：摩卡群聊语音。需要先启动 Qwen TTS API，并注册音色 mocha_cv。
enabled = true
api_url = "http://127.0.0.1:7860/v1/audio/speech"
model = "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
voice = "mocha_cv"
format = "wav"
timeout_seconds = 300
max_chars = 80
cooldown_seconds = 120
